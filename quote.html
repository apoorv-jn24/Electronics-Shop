<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor & House-Wiring Bulk Quote | Everest Electricals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-['Plus_Jakarta_Sans'] antialiased">

  <header class="bg-[#090D16] text-white py-4 px-6 border-b border-white/10">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-bold"><i class="fas fa-bolt"></i></span>
        <span class="font-['Space_Grotesk'] font-bold text-lg">EVEREST <span class="text-amber-400">ELECTRICALS</span></span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-amber-400 hover:underline">&larr; Back to Catalog</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-10">
      <span class="text-xs font-mono uppercase tracking-widest text-amber-600 font-bold">Wholesale Trade Counter · Saroorpur Kalan</span>
      <h1 class="font-['Space_Grotesk'] text-3xl font-bold mt-1 mb-2">Request Contractor / Bulk House-Wiring Quote</h1>
      <p class="text-sm text-slate-600 mb-8">Build your itemized material list below or paste your electrician's slip for wholesale trade rates.</p>

      <form id="quoteForm" class="space-y-6" novalidate>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Full Name *</label>
            <input type="text" id="quoteName" required placeholder="e.g. Ramesh Singh" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Contractor / Firm Name (Optional)</label>
            <input type="text" id="quoteCompany" placeholder="e.g. RS Electrical Works" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">10-Digit Mobile / WhatsApp Number *</label>
            <input type="tel" id="quotePhone" required placeholder="9876543210" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Delivery Village / Site Location *</label>
            <input type="text" id="quoteLocation" required placeholder="e.g. Baraut / Saroorpur Kalan" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-amber-500 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Material List & Quantities *</label>
          <textarea id="quoteMessage" rows="6" required placeholder="e.g.&#10;- 10 Coils Finolex 1.5 sq.mm FR Wire&#10;- 4 Coils Finolex 2.5 sq.mm FR Wire&#10;- 1x Polycab 8-Way Double Door DB&#10;- 60x Anchor Roma Modular Switches" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-mono focus:border-amber-500 outline-none"></textarea>
        </div>

        <div id="quoteErrorBanner" class="hidden p-3.5 rounded-xl bg-red-50 border border-red-300 text-red-700 text-xs font-bold"></div>

        <button type="submit" class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg transition">
          <i class="fas fa-paper-plane mr-2"></i> Generate Official Trade Quote Request
        </button>
      </form>
    </div>
  </main>

  <script>
    // Pre-populate from Estimate Cart if items exist
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const savedCart = JSON.parse(localStorage.getItem('ee_estimate_cart') || '[]');
        if (savedCart.length > 0) {
          const lines = savedCart.map(i => `- ${i.qty}x ${i.name} (SKU: ${i.sku}) @ ₹${i.price}`);
          document.getElementById('quoteMessage').value = lines.join('\n');
        }
      } catch (e) {}
    });

    document.getElementById('quoteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const err = document.getElementById('quoteErrorBanner');
      err.classList.add('hidden');

      const name = document.getElementById('quoteName').value.trim();
      const phone = document.getElementById('quotePhone').value.trim().replace(/\s|-/g, '');
      const loc = document.getElementById('quoteLocation').value.trim();
      const msg = document.getElementById('quoteMessage').value.trim();

      if (!name || !phone || !loc || !msg) {
        err.textContent = 'Please complete all required fields.';
        err.classList.remove('hidden');
        return;
      }
      if (!/^(\+91)?[6-9]\d{9}$/.test(phone)) {
        err.textContent = 'Please enter a valid 10-digit Indian mobile number.';
        err.classList.remove('hidden');
        return;
      }

      const subject = encodeURIComponent(`Trade Quote Request: ${name} (${loc})`);
      const body = encodeURIComponent(`Customer: ${name}\nPhone: ${phone}\nLocation: ${loc}\n\nMaterial List:\n${msg}`);
      window.location.href = `mailto:apoorvjainji@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
